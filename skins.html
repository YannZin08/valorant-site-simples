<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins · Valorant Hub</title>
    <meta name="description" content="Skins do Valorant com preço em VP e link para ver em jogo.">
    <link rel="stylesheet" href="style.css?v=14">
</head>

<body>

    <!-- CABEÇALHO (igual nas 3 páginas; só muda o aria-current) -->
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a class="marca" href="index.html">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" aria-hidden="true">
                    <path d="M12 2v6M12 16v6M2 12h6M16 12h6" />
                    <rect x="11" y="11" width="2" height="2" fill="currentColor" stroke="none" />
                </svg>
                <span>Valorant Hub</span>
            </a>
            <nav class="nav" aria-label="Seções do site">
                <a class="nav-link" href="index.html">Miras</a>
                <a class="nav-link" href="agentes.html">Agentes</a>
                <a class="nav-link" href="skins.html" aria-current="page">Skins</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="pagina-topo">
            <div class="container">
                <p class="pagina-rotulo" id="skins-contagem">Skins</p>
                <h1>Skins</h1>
                <p class="pagina-descricao">Skins com o preço em VP e um link para ver cada uma em jogo.</p>
            </div>
        </section>

        <section class="container">
            <div class="barra">
                <div class="controle">
                    <span class="rotulo">Arma</span>
                    <!-- Botões criados pelo skins.js a partir das categorias -->
                    <div class="segmentos" id="filtros-skins"></div>
                </div>
            </div>

            <!-- Os cards são criados pelo skins.js a partir do skins-data.js -->
            <div class="grade grade-4" id="skins-grid"></div>
        </section>
    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <div class="container rodape-conteudo">
            <span><strong>Valorant Hub</strong> · feito por Yann</span>
            <span>Site de fã. Não afiliado à Riot Games.</span>
        </div>
    </footer>

    <script src="skins-data.js?v=14"></script>
    <script src="skins.js?v=14"></script>
</body>

</html>
