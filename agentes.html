<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhores Agentes por Mapa - Valorant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Melhores Agentes</h1>
            <p>Os melhores agentes para cada mapa do Valorant.</p>

            <div class="hero-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                    ← Voltar
                </button>
            </div>
        </div>
    </section>

    <!-- MAPAS -->
    <div class="miras-grid">

    <!-- MAPA: CORRODE -->
    <div class="card agent-map-card">

        <div class="card-image">
            <img src="assets/img-mapas/corroid.jpg" alt="Corrode">
        </div>

        <div class="card-content">
            <h3>CORRODE</h3>

            <div class="agents-list">
                <div class="agent"><img src="assets/img-agentes/omen.png"><span>Omen</span></div>
                <div class="agent"><img src="assets/img-agentes/sova.png"><span>Sova</span></div>
                <div class="agent"><img src="assets/img-agentes/killjoy.png"><span>Killjoy</span></div>
                <div class="agent"><img src="assets/img-agentes/Phoenix.png"><span>Phoenix</span></div>
                <div class="agent"><img src="assets/img-agentes/Fade.png"><span>Fade</span></div>
                <div class="agent"><img src="assets/img-agentes/skye.png"><span>Skye</span></div>
                <div class="agent"><img src="assets/img-agentes/Chamber.png"><span>Chamber</span></div>
                <div class="agent"><img src="assets/img-agentes/Cypher.png"><span>Cypher</span></div>
            </div>
        </div>

    </div>

    <!-- MAPA: BIND -->
    <div class="card agent-map-card">

        <div class="card-image">
            <img src="assets/img-mapas/bind.png" alt="Bind">
        </div>

        <div class="card-content">
            <h3>BIND</h3>

            <div class="agents-list">
                <div class="agent"><img src="assets/img-agentes/raze.png"><span>Raze</span></div>
                <div class="agent"><img src="assets/img-agentes/brimstone.png"><span>Brimstone</span></div>
                <div class="agent"><img src="assets/img-agentes/skye.png"><span>Skye</span></div>
                <div class="agent"><img src="assets/img-agentes/Killjoy.png"><span>Killjoy</span></div>
                <div class="agent"><img src="assets/img-agentes/clove.png"><span>Clove</span></div>
                <div class="agent"><img src="assets/img-agentes/Fade.png"><span>Fade</span></div>
                <div class="agent"><img src="assets/img-agentes/Sage.png"><span>Sage</span></div>
                <div class="agent"><img src="assets/img-agentes/Cypher.png"><span>Cypher</span></div>
            </div>
        </div>

    </div>

    <!-- MAPA: HAVEN -->
    <div class="card agent-map-card">

        <div class="card-image">
            <img src="assets/img-mapas/haven.png" alt="Haven">
        </div>

        <div class="card-content">
            <h3>HAVEN</h3>

            <div class="agents-list">
                <div class="agent"><img src="assets/img-agentes/jett.png"><span>Jett </span></div>
                <div class="agent"><img src="assets/img-agentes/sova.png"><span>Sova</span></div>
                <div class="agent"><img src="assets/img-agentes/killjoy.png"><span>Killjoy</span></div>
                <div class="agent"><img src="assets/img-agentes/clove.png"><span>Clove</span></div>
                <div class="agent"><img src="assets/img-agentes/omen.png"><span>Omen</span></div>
                <div class="agent"><img src="assets/img-agentes/skye.png"><span>Skye</span></div>
                <div class="agent"><img src="assets/img-agentes/sage.png"><span>Sage</span></div>
                <div class="agent"><img src="assets/img-agentes/chamber.png"><span>Chamber</span></div>
            </div>
        </div>

    </div>

</div>


    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Valorant Agents by Yann. Não afiliado à Riot Games.</p>
    </footer>

</body>

</html>
