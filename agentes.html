<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhores Agentes por Mapa - Valorant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Melhores Agentes</h1>
            <p>Os agentes mais fortes em cada mapa da rotação competitiva atual.</p>

            <div class="hero-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                    ← Voltar
                </button>
            </div>
        </div>
    </section>

    <!-- MAPAS -->
    <section class="miras-section">
        <div class="container">
            <div class="mapas-topo">
                <h2>Rotação competitiva</h2>
                <p class="rotacao-info" id="rotacao-info"></p>
                <p class="rotacao-legenda">A % embaixo de cada agente é quantas vezes ele foi escolhido naquele mapa em
                    partidas profissionais.</p>
            </div>

            <!-- Os cards são criados pelo agentes.js a partir do mapas-data.js -->
            <div class="miras-grid" id="mapas-grid"></div>

            <div class="fora-rotacao">
                <span class="controle-rotulo">Fora da rotação</span>
                <div class="mira-tags" id="fora-rotacao"></div>
            </div>
        </div>
    </section>

    <!-- MODAL DO MINIMAPA -->
    <div class="map-modal" id="mapModal">
        <div class="map-modal-content">
            <button class="close-modal" onclick="closeMap()">✕</button>
            <h2 id="mapTitle">Mapa</h2>
            <img id="mapImage" src="" alt="Minimapa">
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Valorant Agents by Yann. Não afiliado à Riot Games.</p>
    </footer>

    <script src="script.js"></script>
    <script src="mapas-data.js"></script>
    <script src="agentes.js"></script>
</body>

</html>
