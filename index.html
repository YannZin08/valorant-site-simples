<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Crosshairs - Miras e Skins</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Valorant Crosshairs</h1>
            <p>Descubra as melhores miras para melhorar sua precisão no Valorant. Copie os IDs e customize sua
                experiência.</p>
            <div class="hero-buttons">
                <button class="btn btn-primary" onclick="window.location.href='skins.html'">
                    Explorar Skins
                </button>

                <button class="btn btn-secondary" onclick="window.location.href='agentes.html'">
                    Melhores Agentes para cada mapa
                </button>
            </div>
        </div>
    </section>

    <!-- Miras -->
    <section class="miras-section">
        <div class="container">
            <div class="miras-topo">
                <h2>Miras Disponíveis</h2>

                <!-- Opções de visualização (valem para todas as prévias) -->
                <div class="miras-controles">
                    <div class="controle">
                        <span class="controle-rotulo">Fundo</span>
                        <div class="controle-opcoes" id="opcoes-fundo">
                            <button type="button" class="filter-btn active" data-fundo="parede">Parede</button>
                            <button type="button" class="filter-btn" data-fundo="clara">Clara</button>
                            <button type="button" class="filter-btn" data-fundo="escura">Escura</button>
                            <button type="button" class="filter-btn" data-fundo="mapa">Mapa</button>
                        </div>
                    </div>
                    <div class="controle">
                        <span class="controle-rotulo">Zoom</span>
                        <div class="controle-opcoes" id="opcoes-zoom">
                            <button type="button" class="filter-btn" data-zoom="1">Real</button>
                            <button type="button" class="filter-btn active" data-zoom="2">2x</button>
                            <button type="button" class="filter-btn" data-zoom="4">4x</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulário: adicionar mira -->
            <form class="card add-mira" id="form-mira" autocomplete="off">
                <div class="add-mira-campos">
                    <h3>Adicionar mira</h3>

                    <label class="campo">
                        <span>Nome <small>(opcional)</small></span>
                        <input type="text" id="mira-nome" maxlength="40" placeholder="Ex.: Mira do TenZ">
                    </label>

                    <label class="campo">
                        <span>Código da mira</span>
                        <textarea id="mira-codigo" rows="3"
                            placeholder="Cole o código exportado no jogo (Configurações → Mira → Exportar)"></textarea>
                    </label>

                    <p class="add-mira-erro" id="mira-erro" aria-live="polite"></p>

                    <button type="submit" class="btn btn-primary" id="btn-adicionar" disabled>Adicionar mira</button>
                </div>

                <div class="card-image mira-preview">
                    <canvas id="previa-mira"></canvas>
                    <span class="previa-dica" id="previa-dica">A prévia aparece aqui</span>
                </div>
            </form>

            <!-- Os cards são criados pelo miras.js -->
            <div class="miras-grid" id="miras-grid"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Valorant Crosshairs by Yann. Não afiliado com Riot Games.</p>
    </footer>

    <script src="script.js"></script>
    <script src="reticula.js"></script>
    <script src="miras-data.js"></script>
    <script src="miras.js"></script>
</body>

</html>
